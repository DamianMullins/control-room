name: CI

# Docs-only pushes skip the pipeline (they cannot break the build); pull requests are
# deliberately unfiltered so the checks always report on a PR. Don't widen the ignore
# without a reason — it is here to keep doc commits off the queue, not to save minutes
# (this repo is public, so Actions minutes are free).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # No environment variables: the app reads its tokens at request time, so the
      # build must not depend on them (verified locally with .env removed).
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm check

      - name: Build
        run: pnpm build
